[package]
name = "aster-rune"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Aster native email client on Rune"

[dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "3ff3cc6152b9034a1d996e3a5575c51fab3b56b8", features = ["native-file-dialog"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "3ff3cc6152b9034a1d996e3a5575c51fab3b56b8", features = ["markdown"] }
aster-client-core = { workspace = true }
aster-theme = { path = "../aster-theme" }
aster-mailhtml = { path = "../aster-mailhtml" }
serde_json = { workspace = true }
chrono = { version = "0.4", features = ["clock"] }
tiny_http = "0.12"
uuid = { version = "1", features = ["v4"] }
tokio = { workspace = true }
tracing = { workspace = true }
